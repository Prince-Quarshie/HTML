<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="min-h-screen bg-white flex items-center justify-center p-4 font-sans"
    >
       <div
        class="w-full max-w-sm shadow-2xl overflow-hidden rounded-lg border border-gray-300"
      >
        <!-- Display Screen -->
        <div class="bg-slate-500 p-6 flex justify-end items-center">
          <div class="text-white text-6xl font-light tracking-wider">0</div>
        </div>

        <!-- Keypad -->
        <div class="flex flex-col text-2xl font-normal">
          <!-- Row 1 -->
          <div class="flex w-full">
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              AC
            </button>
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              +/-
            </button>
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              %
            </button>
            <button
              class="w-1/4 py-4 bg-orange-400 text-white hover:bg-orange-500 active:bg-orange-600 border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              &div;
            </button>
          </div>

          <!-- Row 2 -->
          <div class="flex w-full">
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              7
            </button>
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              8
            </button>
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              9
            </button>
            <button
              class="w-1/4 py-4 bg-orange-400 text-white hover:bg-orange-500 active:bg-orange-600 border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              x
            </button>
          </div>

          <!-- Row 3 -->
          <div class="flex w-full">
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              4
            </button>
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              5
            </button>
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              6
            </button>
            <button
              class="w-1/4 py-4 bg-orange-400 text-white hover:bg-orange-500 active:bg-orange-600 border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              -
            </button>
          </div>

          <!-- Row 4 -->
          <div class="flex w-full">
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              1
            </button>
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              2
            </button>
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              3
            </button>
            <button
              class="w-1/4 py-4 bg-orange-400 text-white hover:bg-orange-500 active:bg-orange-600 border-b border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              +
            </button>
          </div>

          <!-- Row 5 (Bottom) -->
          <div class="flex w-full">
            <!-- 0 spans 2 columns (50% width) -->
            <button
              class="w-2/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-gray-300 flex items-center pl-8 transition-colors duration-150"
            >
              0
            </button>
            <button
              class="w-1/4 py-4 bg-gray-200 hover:bg-gray-300 active:bg-gray-400 border-r border-gray-300 flex items-center justify-center transition-colors duration-150"
            >
              .
            </button>
            <button
              class="w-1/4 py-4 bg-orange-400 text-white hover:bg-orange-500 active:bg-orange-600 flex items-center justify-center transition-colors duration-150"
            >
              =
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
